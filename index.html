<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScoreCarts Qatar – Store Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;height:100vh;color:#1b1f24}
#panel{width:340px;max-width:42vw;overflow:auto;border-right:1px solid #e3e6ea;background:#fafbfc;display:flex;flex-direction:column}
header{padding:16px;border-bottom:1px solid #e3e6ea;background:#fff;position:sticky;top:0;z-index:2}
h1{font-size:17px;margin:0 0 4px}.sub{font-size:12.5px;color:#5b6470}
.stats{display:flex;gap:8px;margin-top:10px}.stat{flex:1;background:#f1f4f8;border-radius:8px;padding:8px;text-align:center}.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:#5b6470}
#q{width:100%;margin-top:10px;padding:8px 10px;border:1px solid #d5dae0;border-radius:8px;font-size:13px}
#cities{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;padding:4px 9px;border-radius:999px;border:1px solid #d5dae0;background:#fff;cursor:pointer}.chip.on{background:#1b1f24;color:#fff;border-color:#1b1f24}
.store{padding:11px 16px;border-bottom:1px solid #eef0f3;cursor:pointer}.store:hover,.store.sel{background:#eef4ff}
.store .n{font-size:13.5px;font-weight:600}.store .m{font-size:12px;color:#5b6470;margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.freq{background:#e7f6ec;color:#17723a;font-weight:600;padding:1px 7px;border-radius:999px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
#map{flex:1}
.leaflet-popup-content{font-size:13px}.leaflet-popup-content b{font-size:14px}
@media(max-width:700px){body{flex-direction:column-reverse}#panel{width:100%;max-width:none;height:45vh;border-right:0;border-top:1px solid #e3e6ea}#map{height:55vh;flex:none}}
</style></head><body>
<aside id="panel"><header><h1>ScoreCarts Qatar · Store Map</h1><div class="sub">Foster Clark stores · visit frequency per month</div>
<div class="stats"><div class="stat"><b id="sStores"></b><span>stores</span></div><div class="stat"><b id="sVisits"></b><span>visits / month</span></div><div class="stat"><b id="sCities"></b><span>areas</span></div></div>
<input id="q" placeholder="Search store or retailer"><div id="cities"></div></header><div id="list"></div></aside>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORES=[{"name": "AL MEERA (RT RAWDAT AL HAMAMA BRANCH)", "city": "Al Daayen", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/T6v4DQE89R6Wh2Ti8", "lat": 25.4363, "lng": 51.4416}, {"name": "AL MEERA AL KHOR (NEW)", "city": "Al Khor", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/FRTR46XC6jSHtG2r6", "lat": 25.6672, "lng": 51.4877}, {"name": "LULU HYPER MARKET TRDG, AL KHOR-3060", "city": "Al Khor", "channel": "key acc", "retailer": "Lulu", "frequency": 4, "map": "https://maps.app.goo.gl/QEDsXv9WkymP3hFt5", "lat": 25.6748, "lng": 51.5021}, {"name": "AL MEERA AZGHAWA", "city": "Al Rayyan", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/qrXDuiBnd2ei6E8R6", "lat": 25.3544, "lng": 51.4374}, {"name": "MAJID AL FUTTAIM HYPERMARKETS(M-OF-QATAR", "city": "Al Rayyan", "channel": "key acc", "retailer": "Carrefour", "frequency": 4, "map": "https://maps.app.goo.gl/YeNdsU1vwyW1tdXk7", "lat": 25.3286, "lng": 51.3508}, {"name": "AL MEERA WAKHRA BRANCH", "city": "Al Wakrah", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/kDX6kibXstxbCTPJA", "lat": 25.1792, "lng": 51.5987}, {"name": "AL MEERA-WAKHRA (NEW)", "city": "Al Wakrah", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/zMMK5NyBzNfwnhsj7", "lat": 25.1446, "lng": 51.6041}, {"name": "MAJID AL FUTTAIM HYPERMARKETS(AL WAKRA)", "city": "Al Wakrah", "channel": "key acc", "retailer": "Carrefour", "frequency": 4, "map": "https://maps.app.goo.gl/86goQLgKg5r15kbj9", "lat": 25.1711, "lng": 51.5896}, {"name": "AL MEERA HAYAT PLAZA (GEANT)", "city": "Doha", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/cqcgeCP3cTZJCJV47", "lat": 25.2569, "lng": 51.4372}, {"name": "AL MEERA HAZIM AL MARKHIYA", "city": "Doha", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/vjrHS9YqD4NQUYz76", "lat": 25.3374, "lng": 51.5053}, {"name": "AL MEERA AIN KHALID -A065", "city": "Doha", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/z32Z8T1kK9nd52tc6", "lat": 25.2059, "lng": 51.4614}, {"name": "AL MEERA-RAWDAT ELKADEEM", "city": "Doha", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/y1xKHAfdf5MReDGS9", "lat": 25.27, "lng": 51.5199}, {"name": "AL MEERA (LEABAIB -1)", "city": "Doha", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/dzMuXPhxsjNVSYXN8", "lat": 25.38, "lng": 51.4636}, {"name": "AL MEERA MANSOURA BRANCH", "city": "Doha", "channel": "key acc", "retailer": "Al Meera", "frequency": 4, "map": "https://maps.app.goo.gl/gNKEoLh5zPHX9n5q6", "lat": 25.2712, "lng": 51.5292}, {"name": "LULU HYPERMARKET TRDG,OLD AIRPORT-3020", "city": "Doha", "channel": "key acc", "retailer": "Lulu", "frequency": 4, "map": "https://maps.app.goo.gl/oeN6U8PPZwHwV67F9", "lat": 25.2539, "lng": 51.5452}, {"name": "LULU HYPERMARKET TRDG,GHARAFA-3040", "city": "Doha", "channel": "key acc", "retailer": "Lulu", "frequency": 4, "map": "https://maps.app.goo.gl/iHy3uvGfhKpym4FH9", "lat": 25.3378, "lng": 51.4602}, {"name": "LULU HYPERMARKET TRDG,AL MESSILIA,-3015", "city": "Doha", "channel": "key acc", "retailer": "Lulu", "frequency": 4, "map": "https://maps.app.goo.gl/CaXTtWosmPWpjYLa7", "lat": 25.3009, "lng": 51.4882}, {"name": "RAWABI HYPERMARKET-IZGHAWA", "city": "Doha", "channel": "key acc", "retailer": "Rawabi", "frequency": 4, "map": "https://maps.app.goo.gl/C2KaHMmf5GvDZHVh6", "lat": 25.3511, "lng": 51.4308}, {"name": "SAFARI HYPER MARKET-SALWA ROAD", "city": "Doha", "channel": "key acc", "retailer": "Safari", "frequency": 4, "map": "https://maps.app.goo.gl/voNsE3Bd7fs4RmR8A", "lat": 25.2262, "lng": 51.4343}, {"name": "MAJID AL FUTTAIM HYPER MARKETS(L-MARK)", "city": "Doha", "channel": "key acc", "retailer": "Carrefour", "frequency": 4, "map": "https://maps.app.goo.gl/aVCkVBmg28TgN5Sw9", "lat": 25.3343, "lng": 51.4681}, {"name": "MAJID AL FUTTAIM HYPER MARKETS(C-CENTRE)", "city": "Doha", "channel": "key acc", "retailer": "Carrefour", "frequency": 4, "map": "https://maps.app.goo.gl/qHBBQyBejBR2xKQC7", "lat": 25.3248, "lng": 51.5294}, {"name": "MAJID AL FUTTAIM HYPER MARKETS(VILLAGIO)", "city": "Doha", "channel": "key acc", "retailer": "Carrefour", "frequency": 4, "map": "https://maps.app.goo.gl/nGjS98hP3q95vht38", "lat": 25.2588, "lng": 51.4426}, {"name": "ABA MONOPRIX -DFC", "city": "Doha", "channel": "key acc", "retailer": "Monoprix", "frequency": 4, "map": "https://maps.app.goo.gl/C1d8fMbd7cgAL97fA", "lat": 25.3885, "lng": 51.441}, {"name": "ABA MONOPRIX AL WAAB", "city": "Doha", "channel": "key acc", "retailer": "Monoprix", "frequency": 4, "map": "https://maps.app.goo.gl/deGqrVX7VkQj4HMPA", "lat": 25.2684, "lng": 51.4499}, {"name": "ABA MONOPRIX-VENDOME", "city": "Lusail", "channel": "key acc", "retailer": "Monoprix", "frequency": 4, "map": "https://maps.app.goo.gl/871ES4Pkjr1X1tg38", "lat": 25.4051, "lng": 51.518}];
const COLORS={'Al Meera':'#d9342b','Carrefour':'#1f5fbf','Lulu':'#1a8f3c','Monoprix':'#e08a00','Rawabi':'#7a3fb8','Safari':'#0b8f8f'};
const map=L.map('map').setView([25.35,51.45],10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const markers=STORES.map((s,i)=>{const c=COLORS[s.retailer]||'#444';
 const m=L.circleMarker([s.lat,s.lng],{radius:8,color:'#fff',weight:2,fillColor:c,fillOpacity:.95}).addTo(map);
 m.bindPopup(`<b>${s.name}</b><br>${s.retailer} · ${s.city}<br>Frequency: <b>${s.frequency} visits / month</b><br><a href="${s.map}" target="_blank" rel="noopener">Open in Google Maps</a>`);
 m.on('click',()=>sel(i,false));return m;});
map.fitBounds(L.latLngBounds(STORES.map(s=>[s.lat,s.lng])),{padding:[30,30]});
let city=null;const cities=[...new Set(STORES.map(s=>s.city))].sort();
const cEl=document.getElementById('cities');
['All',...cities].forEach(c=>{const b=document.createElement('button');b.className='chip'+(c==='All'?' on':'');b.textContent=c;b.onclick=()=>{city=c==='All'?null:c;[...cEl.children].forEach(x=>x.classList.toggle('on',x===b));render();};cEl.appendChild(b);});
document.getElementById('q').oninput=render;
function sel(i,fly=true){document.querySelectorAll('.store').forEach(e=>e.classList.toggle('sel',+e.dataset.i===i));if(fly)map.flyTo([STORES[i].lat,STORES[i].lng],16);markers[i].openPopup();const el=document.querySelector(`.store[data-i="${i}"]`);if(el&&!fly)el.scrollIntoView({block:'nearest'});}
function render(){const q=document.getElementById('q').value.toLowerCase();const list=document.getElementById('list');list.innerHTML='';const vis=[];
 STORES.forEach((s,i)=>{const ok=(!city||s.city===city)&&(!q||(s.name+' '+s.retailer).toLowerCase().includes(q));
  if(ok){markers[i].addTo(map);vis.push(s);const d=document.createElement('div');d.className='store';d.dataset.i=i;
   d.innerHTML=`<div class="n">${s.name}</div><div class="m"><span class="dot" style="background:${COLORS[s.retailer]||'#444'}"></span>${s.retailer} · ${s.city}<span class="freq">${s.frequency}× / month</span></div>`;
   d.onclick=()=>sel(i);list.appendChild(d);} else map.removeLayer(markers[i]);});
 document.getElementById('sStores').textContent=vis.length;document.getElementById('sVisits').textContent=vis.reduce((a,s)=>a+s.frequency,0);document.getElementById('sCities').textContent=new Set(vis.map(s=>s.city)).size;
 if(vis.length)map.fitBounds(L.latLngBounds(vis.map(s=>[s.lat,s.lng])),{padding:[30,30],maxZoom:15});}
render();
</script></body></html>
